<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pipeline DevSecOps complet</title>
<desc>git push declenche build, test, puis deux scans de securite en parallele : Trivy et Gitleaks.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="600" fill="#0d1117"/>
<rect x="40" y="40" width="600" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="340" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#e6edf3">git push</text>
<text x="340" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">déclenche le pipeline complet</text>
<line x1="340" y1="100" x2="340" y2="130" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="130" width="280" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="180" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e6edf3">build</text>
<rect x="360" y="130" width="280" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="500" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e6edf3">test</text>
<line x1="180" y1="180" x2="180" y2="210" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="500" y1="180" x2="500" y2="210" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="180" y1="155" x2="500" y2="155" stroke="#8b949e" stroke-width="1"/>
<rect x="40" y="210" width="280" height="90" rx="10" fill="#0c2d48" stroke="#1f6feb" stroke-width="1"/>
<text x="180" y="235" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#79c0ff">trivy-scan</text>
<text x="180" y="253" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#79c0ff">avant : 7 vulnérabilités HIGH</text>
<text x="180" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#79c0ff">après correction : 0</text>
<text x="180" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#79c0ff">(apk upgrade Dockerfile)</text>
<rect x="360" y="210" width="280" height="90" rx="10" fill="#3d1f0f" stroke="#d05538" stroke-width="1"/>
<text x="500" y="235" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#f0997b">gitleaks-scan</text>
<text x="500" y="253" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f0997b">20 commits scannés</text>
<text x="500" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f0997b">no leaks found</text>
<text x="500" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f0997b">aucun secret dans l'historique</text>
<line x1="180" y1="300" x2="180" y2="330" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="500" y1="300" x2="500" y2="330" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="180" y1="330" x2="500" y2="330" stroke="#8b949e" stroke-width="1"/>
<line x1="340" y1="330" x2="340" y2="360" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="360" width="600" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="340" y="384" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Résultat visible sur GitLab</text>
<text x="340" y="402" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">4 étapes, historique complet à chaque commit</text>
<line x1="340" y1="420" x2="340" y2="450" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="450" width="600" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="340" y="478" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Limite assumée aujourd'hui</text>
<text x="340" y="498" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">exit-code 0 : les scans informent, sans bloquer le pipeline</text>
<text x="340" y="516" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">passer à exit-code 1 = prochaine étape (échec bloquant)</text>
</svg>
