<svg width="680" height="564" viewBox="0 0 680 564" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Test de resilience Kubernetes</title>
<desc>Suppression volontaire d'un pod, detection de l'ecart par K3s, et recreation automatique.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="564" fill="#0d1117"/>
<rect x="40" y="60" width="600" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="340" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#e6edf3">2 pods actifs</text>
<text x="340" y="102" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">état désiré respecté</text>
<line x1="340" y1="124" x2="340" y2="160" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="160" width="600" height="64" rx="10" fill="#3d1f0f" stroke="#d05538" stroke-width="1"/>
<text x="340" y="184" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#f0997b">Suppression d'un pod</text>
<text x="340" y="202" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f0997b">kubectl delete pod (volontaire)</text>
<line x1="340" y1="224" x2="340" y2="260" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="260" width="600" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="340" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#e6edf3">K3s détecte l'écart</text>
<text x="340" y="302" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">1 pod au lieu de 2</text>
<line x1="340" y1="324" x2="340" y2="360" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="360" width="600" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="340" y="384" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Nouveau pod créé</text>
<text x="340" y="402" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">automatiquement, sans intervention</text>
<line x1="340" y1="424" x2="340" y2="460" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="460" width="600" height="64" rx="10" fill="#0c2d48" stroke="#1f6feb" stroke-width="1"/>
<text x="340" y="484" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#79c0ff">2 pods actifs</text>
<text x="340" y="502" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#79c0ff">état désiré rétabli</text>
</svg>
