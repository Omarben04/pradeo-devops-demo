<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Centralisation des secrets avec Vault</title>
<desc>Avant : mots de passe disperses en clair. Apres : centralises et chiffres dans HashiCorp Vault.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="560" fill="#0d1117"/>
<text x="180" y="35" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b949e">AVANT</text>
<text x="500" y="35" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b949e">APRÈS</text>
<rect x="40" y="55" width="280" height="45" rx="8" fill="#3d1f0f" stroke="#d05538" stroke-width="1"/>
<text x="180" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f0997b">Graylog : admin/admin (clair)</text>
<rect x="40" y="110" width="280" height="45" rx="8" fill="#3d1f0f" stroke="#d05538" stroke-width="1"/>
<text x="180" y="137" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f0997b">Grafana : mot de passe (clair)</text>
<rect x="40" y="165" width="280" height="45" rx="8" fill="#3d1f0f" stroke="#d05538" stroke-width="1"/>
<text x="180" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f0997b">GLPI : mot de passe (clair)</text>
<rect x="40" y="220" width="280" height="45" rx="8" fill="#3d1f0f" stroke="#d05538" stroke-width="1"/>
<text x="180" y="247" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f0997b">Headwind MDM : mot de passe (clair)</text>
<rect x="40" y="275" width="280" height="45" rx="8" fill="#3d1f0f" stroke="#d05538" stroke-width="1"/>
<text x="180" y="302" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f0997b">Clé SSH d'accès démo (clair)</text>
<line x1="330" y1="180" x2="360" y2="180" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="370" y="80" width="270" height="280" rx="16" fill="#0c2d48" stroke="#1f6feb" stroke-width="1.5"/>
<text x="505" y="115" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#79c0ff">HashiCorp Vault</text>
<text x="505" y="133" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#79c0ff">security-server : 8200</text>
<rect x="390" y="150" width="230" height="35" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="505" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e6edf3">secret/pradeo-project</text>
<rect x="390" y="195" width="230" height="35" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="505" y="217" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e6edf3">secret/amaury-access</text>
<rect x="390" y="240" width="230" height="35" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="505" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e6edf3">secret/amaury-ssh-key</text>
<text x="505" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#79c0ff">chiffré, versionné, accès</text>
<text x="505" y="316" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#79c0ff">par token uniquement</text>
<text x="505" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8b949e">(mode développement — voir limite assumée)</text>
<line x1="340" y1="400" x2="340" y2="430" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="430" width="600" height="100" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="340" y="458" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Test réel effectué</text>
<text x="340" y="478" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">vault kv put secret/pradeo-project ... puis vault kv get</text>
<text x="340" y="496" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">écriture et lecture confirmées, secret versionné (v1)</text>
<text x="340" y="514" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">dashboard web consultable sur le port 8200</text>
</svg>
