stages:
  - build
  - test

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - cd app
    - docker build -t pradeo-demo:$CI_COMMIT_SHORT_SHA .
  only:
    - main

test:
  stage: test
  image: python:3.11-slim
  script:
    - cd app
    - pip install -r requirements.txt
    - python -c "import app; print('Import OK, app se charge correctement')"
  only:
    - main
