apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-omar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-omar
  template:
    metadata:
      labels:
        app: portfolio-omar
    spec:
      containers:
        - name: portfolio-omar
          image: portfolio-omar:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-omar-service
spec:
  type: NodePort
  selector:
    app: portfolio-omar
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
