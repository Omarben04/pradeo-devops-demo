apiVersion: apps/v1
kind: Deployment
metadata:
  name: pradeo-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pradeo-demo
  template:
    metadata:
      labels:
        app: pradeo-demo
    spec:
      containers:
        - name: pradeo-demo
          image: pradeo-demo:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pradeo-demo-service
spec:
  type: NodePort
  selector:
    app: pradeo-demo
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080