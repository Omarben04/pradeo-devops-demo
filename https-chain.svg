<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Chaine HTTPS complete</title>
<desc>DuckDNS, Let's Encrypt, Nginx, vers le portfolio Kubernetes.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="500" fill="#0d1117"/>
<rect x="40" y="40" width="600" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="340" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#e6edf3">pradeo0projet0portfolio.duckdns.org</text>
<text x="340" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">nom de domaine gratuit (DuckDNS)</text>
<line x1="340" y1="100" x2="340" y2="130" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="130" width="600" height="60" rx="10" fill="#0c2d48" stroke="#1f6feb" stroke-width="1"/>
<text x="340" y="154" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#79c0ff">Certbot + Let's Encrypt</text>
<text x="340" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#79c0ff">certificat gratuit, renouvellement automatique</text>
<line x1="340" y1="190" x2="340" y2="220" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="220" width="600" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="340" y="244" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Nginx (reverse proxy)</text>
<text x="340" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">écoute sur le port 443, chiffrement TLS 1.2/1.3</text>
<line x1="340" y1="280" x2="340" y2="310" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="310" width="600" height="60" rx="10" fill="#3d1f0f" stroke="#d05538" stroke-width="1"/>
<text x="340" y="334" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#f0997b">Portfolio (Kubernetes, port 30081)</text>
<text x="340" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f0997b">reçoit le trafic déchiffré en interne</text>
<line x1="340" y1="370" x2="340" y2="400" stroke="#8b949e" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="400" width="600" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="340" y="425" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Difficulté rencontrée</text>
<text x="340" y="445" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">502 Bad Gateway malgré un portfolio fonctionnel en local</text>
<text x="340" y="463" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b949e">cause : SELinux bloquait Nginx → setsebool httpd_can_network_connect</text>
</svg>
