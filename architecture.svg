<svg width="680" height="550" viewBox="0 0 680 550" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Architecture du projet Pradeo DevOps Demo</title>
<desc>Deux VM Oracle Cloud ARM : app-server avec Kubernetes, supervision et EDR ; security-server avec SIEM, gestion de parc et MDM.</desc>
